name: Update Linux screenshots

# The frontend's screenshot tests compare against one reference per OS. CI runs on Linux, so its
# references (…-chromium-linux.png) are taken here, on the same image CI uses, and committed back to
# the branch this is run on. Run it after an intended visual change (Actions → this workflow → Run).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --no-audit --no-fund
      # Writes the references that are missing or differ; fails only on real test failures.
      - run: npx vitest run --update
      - name: Commit the Linux references
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/**/*-chromium-linux.png'
          git diff --cached --quiet && echo "Nothing changed." && exit 0
          git commit -m "Linux screenshot references from CI"
          git push
