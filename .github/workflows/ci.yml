name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  backend:
    name: Backend (build + unit + integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      # Integration tests use Testcontainers; Docker is available on ubuntu runners.
      - run: dotnet test --no-build -c Release --collect:"XPlat Code Coverage"

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  repomap:
    name: Repo map tool (typecheck + unit + browser)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/repomap
    steps:
      - uses: actions/checkout@v4
      # The C# extractor is built and run by the whole-repository pipeline test.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/repomap/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npx playwright test --project=chromium --project=phone
      # Headless WebGL varies between engines on Linux runners: report, don't block.
      - run: npx playwright test --project=webkit --project=firefox
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: repomap-playwright-report
          path: tools/repomap/playwright-report
          retention-days: 7
