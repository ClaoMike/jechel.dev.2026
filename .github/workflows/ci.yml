name: CI

# Every pull request runs the whole test suite; `main` (production) only takes pull requests whose
# Backend and Frontend checks passed (a ruleset on GitHub, see docs/deployment.md).
on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runners are pinned (ubuntu-24.04, not ubuntu-latest, which is moving to Ubuntu 26): the image changes when we choose to.
jobs:
  backend:
    name: Backend (build + unit + integration)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
      # Unit + integration tests with coverage (test.sh). Integration tests use Testcontainers; Docker is available on ubuntu runners.
      - run: ./test.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 7

  frontend:
    name: Frontend (lint + build + tests)
    runs-on: ubuntu-24.04
    # Playwright's image: the Chromium the tests run in, with the fonts the Linux screenshots were taken with.
    # Keep its version the same as the playwright package in frontend/package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: frontend-test-report
          path: |
            frontend/coverage
            frontend/src/**/__screenshots__/**/*-actual-*.png
            frontend/src/**/__screenshots__/**/*-diff-*.png
          retention-days: 7

  e2e:
    name: End to end (Chrome, Edge, Firefox, Safari)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The whole site on a fresh database, in the latest Playwright and the latest of each browser (run.sh installs them
      # every time: Chrome and Edge from their stable channels, Firefox and WebKit from the newest Playwright).
      - run: ./e2e/run.sh
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
