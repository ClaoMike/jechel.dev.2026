<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The "j" from the Vice title. Bump ?v= when the icon changes: browsers cache tab icons hard. -->
    <link rel="icon" href="/favicon.ico?v=3" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <!-- On the Home Screen it opens as an app of its own (and, on an iPhone, may get notifications: public/sw.js). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claudiu Mihai Jechel</title>
    <!-- What search engines and link previews show (LinkedIn, Slack, WhatsApp…): they read this file, not what the app
         draws, so it's the same for every page. The image is drawn by scripts/build_link_preview.mjs. -->
    <meta name="description" content="Claudiu Mihai Jechel's portfolio: the apps I've made, my YouTube videos, my experience, and a way to get in touch." />
    <link rel="canonical" href="https://jechel.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="jechel.dev" />
    <meta property="og:url" content="https://jechel.dev/" />
    <meta property="og:title" content="Claudiu Mihai Jechel" />
    <meta property="og:description" content="The apps I've made, my YouTube videos, my experience, and a way to get in touch." />
    <meta property="og:image" content="https://jechel.dev/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="jechel.dev: Claudiu Mihai Jechel on a motorbike by the sea, with apps, videos and experience" />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Who the site is about, for search engines: a Person, with the profiles that are also theirs. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Claudiu Mihai Jechel",
        "url": "https://jechel.dev/",
        "image": "https://jechel.dev/og-image.jpg",
        "sameAs": ["https://github.com/ClaoMike", "https://www.linkedin.com/in/claudiumihaijechel/", "https://www.instagram.com/claomike/"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
