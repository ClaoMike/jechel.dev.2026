# The site's files, the single-page app's routes, and /api forwarded to the API container.
server {
  listen 80;
  root /usr/share/nginx/html;

  # The same headers Cloudflare adds online (public/_headers), but HTTPS-only ones: this runs on http://localhost.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self'; frame-src https://www.youtube-nocookie.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /api/ {
    proxy_pass http://api:8080;
    # The API builds its addresses (Google's callback) from the host the browser asked for.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    client_max_body_size 200m;
  }

  location = /sw.js {
    add_header Cache-Control no-cache;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
